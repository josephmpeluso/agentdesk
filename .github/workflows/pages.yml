name: Deploy dashboard to GitHub Pages

# Not live yet. This workflow does nothing until Pages is turned on in repo
# Settings → Pages → Build and deployment → Source: "GitHub Actions" — that
# step also requires the repo to be public on GitHub Free. Creating this file
# does not flip either of those switches.
#
# Trigger is manual-only (workflow_dispatch) on purpose: a judgment call, not
# a fact. A push-triggered version is the more common pattern once Pages is
# actually enabled, but until then a push to master would just produce a red
# X in the Actions tab (no Pages environment exists to deploy into yet).
# Add `push: { branches: [master], paths: ['web/**'] }` under `on:` once
# Pages is live, if auto-deploy-on-push is wanted.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # web/ is the whole site: index.html, app.js, style.css, and
      # data/runs.js (the curated evidence trail, already inlined — no
      # fetch(), no build step). Nothing outside web/ ships.
      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
