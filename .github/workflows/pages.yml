name: Deploy dashboard to GitHub Pages

# NOT the live deploy path. The dashboard deploys via Cloudflare Pages
# instead (wrangler, not this workflow) — see DEPLOY.md for why and for the
# actual redeploy command. This file is kept, inert, in case that decision
# ever reverses; it does nothing on its own (workflow_dispatch-only, and
# Pages was never enabled in this repo's GitHub settings).
#
# Trigger is manual-only (workflow_dispatch) on purpose: a judgment call, not
# a fact. A push-triggered version is the more common pattern if this ever
# becomes the live path, but until then a push to master would just produce
# a red X in the Actions tab (no Pages environment exists to deploy into).
# Add `push: { branches: [master], paths: ['web/**'] }` under `on:` if this
# is ever turned on.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # web/ is the whole site: index.html, app.js, style.css, and
      # data/runs.js (the curated evidence trail, already inlined — no
      # fetch(), no build step). Nothing outside web/ ships.
      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
